name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK and NDK
      run: |
        # Download and set up command-line tools
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdline-tools.zip
        sudo mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        # Accept licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Install required SDK packages
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

        # Download NDK directly
        sudo mkdir -p $ANDROID_HOME/ndk
        cd /tmp
        curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip -q ndk.zip
        sudo mv android-ndk-r29 $ANDROID_HOME/ndk/$ANDROID_NDK_VERSION

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y nasm autogen

    - name: Grant execute permission
      run: chmod +x gradlew scripts/*.sh

    - name: Cache FFmpeg kit source
      id: cache-ffmpeg-kit
      uses: actions/cache@v4
      with:
        path: ffmpeg-kit
        key: ffmpeg-kit-${{ hashFiles('scripts/ffmpeg_enable_executable.diff') }}

    - name: Clone and patch ffmpeg-kit
      if: steps.cache-ffmpeg-kit.outputs.cache-hit != 'true'
      run: ./scripts/setup_environ.sh

    - name: Patch ffmpeg-kit if cached
      if: steps.cache-ffmpeg-kit.outputs.cache-hit == 'true'
      run: |
        cd ffmpeg-kit
        git apply --reject --whitespace=fix ../scripts/ffmpeg_enable_executable.diff || true

    - name: Cache FFmpeg build
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: app/src/main/jniLibs
        key: ffmpeg-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('scripts/ffmpeg_enable_executable.diff') }}

    - name: Build FFmpeg native libraries
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: ./scripts/build_libs.sh

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegPlugin-release
        path: app/build/outputs/apk/release/app-release.apk
