name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses || true

    - name: Install NDK
      run: sdkmanager "ndk;29.0.14033849"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y nasm autogen

    - name: Grant execute permission
      run: chmod +x gradlew scripts/*.sh

    - name: Clone and patch ffmpeg-kit
      run: ./scripts/setup_environ.sh

    - name: Build FFmpeg native libraries
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14033849
      run: ./scripts/build_libs.sh

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegPlugin-release
        path: app/build/outputs/apk/release/app-release.apk
