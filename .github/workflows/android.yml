name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK command-line tools
      run: |
        sudo mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdline-tools.zip
        sudo mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest

    - name: Accept licenses and install NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$ANDROID_NDK_VERSION"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y nasm autogen

    - name: Grant execute permission
      run: chmod +x gradlew scripts/*.sh

    - name: Clone and patch ffmpeg-kit
      run: ./scripts/setup_environ.sh

    - name: Build FFmpeg native libraries
      run: ./scripts/build_libs.sh

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegPlugin-release
        path: app/build/outputs/apk/release/app-release.apk
